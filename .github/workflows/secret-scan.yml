name: Secret Scan

# Bloque les pushes contenant des secrets (tokens, clés API, etc.).
# Utilise gitleaks en action officielle. Le projet est PUBLIC — ce workflow
# est la dernière barrière avant exposition publique d'un secret.

on:
  push:
    branches: [main, feat/**, fix/**]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }} # optionnel — pour usage pro